steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'
    
  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
      backendServiceArm: 'fire'
      backendAzureRmStorageAccountName: 'statefilesdata'
      backendAzureRmContainerName: 'fire'
      backendAzureRmKey: '${{ parameters.environment }}.tfstate'
